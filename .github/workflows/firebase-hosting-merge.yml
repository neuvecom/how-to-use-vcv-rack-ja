# 旧 URL（how-to-use-vcv-rack-ja.web.app）を neuve.com へ 301 転送する設定を Firebase Hosting に反映する
# サイト本体は GitHub Pages（deploy.yml）で公開している
name: Deploy redirect to Firebase Hosting

on:
    push:
        branches:
            - main
        paths:
            - firebase.json
            - firebase-redirect/**
            - .github/workflows/firebase-hosting-merge.yml
    workflow_dispatch:

permissions:
    contents: read

jobs:
    deploy_redirect:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: FirebaseExtended/action-hosting-deploy@v0
              with:
                  repoToken: ${{ secrets.GITHUB_TOKEN }}
                  firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HOW_TO_USE_VCV_RACK_JA }}
                  channelId: live
                  projectId: how-to-use-vcv-rack-ja
