# main へのマージ時に本番サイトへデプロイする
name: Deploy to Firebase Hosting (本番)

on:
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    build_and_deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            - run: npm run build

            - uses: FirebaseExtended/action-hosting-deploy@v0
              with:
                  repoToken: ${{ secrets.GITHUB_TOKEN }}
                  firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HOW_TO_USE_VCV_RACK_JA }}
                  channelId: live
                  projectId: how-to-use-vcv-rack-ja
