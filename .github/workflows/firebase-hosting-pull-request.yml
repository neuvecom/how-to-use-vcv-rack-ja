# PR ごとにビルドを確認し、プレビュー用 URL へデプロイする
name: Preview on Firebase Hosting (PR)

on:
    pull_request:

permissions:
    contents: read
    pull-requests: write
    checks: write

jobs:
    build_and_preview:
        runs-on: ubuntu-latest
        env:
            # サービスアカウントの Secret が未登録の間は、ビルド確認のみ行いプレビューは出さない
            HAS_FIREBASE_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HOW_TO_USE_VCV_RACK_JA != '' }}
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            - run: npm run build

            # フォークからの PR には Secret が渡らないため、同じリポジトリの PR だけプレビューする
            - if: env.HAS_FIREBASE_SECRET == 'true' && github.event.pull_request.head.repo.full_name == github.repository
              uses: FirebaseExtended/action-hosting-deploy@v0
              with:
                  repoToken: ${{ secrets.GITHUB_TOKEN }}
                  firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HOW_TO_USE_VCV_RACK_JA }}
                  expires: 7d
                  projectId: how-to-use-vcv-rack-ja
